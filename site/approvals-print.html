<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Approvals path — print sheet</title>
<meta name="description" content="The Alberta data centre approvals path, laid out to print on 11×17 (tabloid) paper.">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%232a78d6'/><text y='70' x='50' text-anchor='middle' font-size='54' font-family='system-ui' font-weight='700' fill='white'>AB</text></svg>">
<style>
/* =============================================================================
   A FIXED ARTBOARD, NOT A RESPONSIVE PAGE.

   The connectors are computed from where the browser actually put the cards.
   That is what makes them true — and it is also why this page must not reflow
   between the screen and the paper. The first version of this sheet shrank the
   type inside `@media print`; the grid re-laid out, the arrows did not, and the
   PDF came out with arrowheads pointing into empty cells.

   So the sheet is sized once, in pixels, to the printable area of the paper,
   and `@media print` changes nothing that has a size. What you see is what
   prints, because it is the same layout.

   1530px maps onto the 16.2in printable width of 17x11in at 10mm margins, so
   1px on screen is 0.76pt on paper: an 11px card title prints at about 8.4pt.
   ========================================================================== */

@page { size: 17in 11in; margin: 10mm; }   /* tabloid, landscape */

:root { --sheet-w: 1530px; }

.sheet-wrap { overflow-x: auto; }          /* only the viewport scrolls */
.sheet {
  width: var(--sheet-w);
  margin: 0 auto;
  padding: 0 0 var(--s-4);
  background: var(--surface);
}
.sheet-bar {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--s-3); flex-wrap: wrap;
  margin-bottom: var(--s-4); padding: var(--s-3) 0;
  border-bottom: 1px solid var(--border);
}
.sheet-bar p { margin: 0; color: var(--ink-secondary); font-size: var(--t-small); max-width: 80ch; }
.sheet-foot {
  margin-top: var(--s-4); padding-top: var(--s-3);
  border-top: 1px solid var(--border);
  color: var(--ink-muted); font-size: 9px;
  display: flex; justify-content: space-between; gap: var(--s-3);
}

/* A printed sheet is a fixed artefact, so it commits to the light palette in
   both themes rather than handing someone a black rectangle. The attribute is
   set after load, because the shared theme toggle reads localStorage on init. */
body { background: var(--page); }

/* Already on the print sheet — the link would only reopen it. */
#ap-print, #ap-download { display: none; }
.sheet-actions { display: flex; gap: var(--s-2); align-items: center; }

/* --- the artboard scale, applied on screen and on paper alike -------------- */
.sheet .ap-scroll { overflow: visible; }
.sheet .ap-grid { min-width: 0; gap: 6px 16px; }

.sheet .ap-head { margin-bottom: 4px; }
.sheet .ap-title { font-size: 19px; margin-bottom: 1px; }
.sheet .ap-intro { font-size: 9.5px; line-height: 1.35; max-width: 1300px; }
.sheet .ap-route-note { font-size: 8px; margin: 1px 0 4px; max-width: 1300px; }
.sheet .ap-legend { font-size: 8.5px; gap: 10px; margin: 0 0 4px; padding: 3px 0; }

.sheet .ap-phase { padding: 3px 6px; }
.sheet .ap-phase-label { font-size: 7px; }
.sheet .ap-phase-name { font-size: 12px; }
.sheet .ap-phase-sub { font-size: 7px; }

.sheet .ap-lane-head { padding: 3px 5px; gap: 0; }
.sheet .ap-lane-label { font-size: 12px; }
.sheet .ap-lane-level, .sheet .ap-lane-body { font-size: 6.5px; }
.sheet .ap-lane-note { font-size: 6px; line-height: 1.2; margin-top: 1px; }
.sheet .ap-level-text { font-size: 7px; }

.sheet .ap-cell { padding: 3px; gap: 3px; }
/* A cell whose two cards have a dependency between them needs room for the
   arrow; at 6px it printed as a stub with a head wider than the line. */
.sheet .ap-cell.is-linked { gap: 18px; }
.sheet .ap-node { padding: 3px 6px; gap: 1px; box-shadow: none; }
.sheet .ap-node:hover { transform: none; box-shadow: none; }
.sheet .ap-node-authority { font-size: 7px; }
.sheet .ap-node-title { font-size: 10px; line-height: 1.18; }
.sheet .ap-tag { font-size: 6.5px; padding: 0 3px; }
.sheet .ap-node-badges { gap: 2px; margin-top: 1px; }

/* Thicker than on screen: a 1.6px hairline survives a screen and disappears
   into a laser printer's dithering. */
.sheet .ap-wire { stroke-width: 2.2; opacity: .8; }
.sheet .ap-wire.is-critical { stroke-width: 3; opacity: 1; }
.sheet .ap-pair { stroke-width: 2; }

.sheet .ap-insights { grid-template-columns: repeat(3, 1fr); gap: var(--s-3); }
/* On screen a 13% tint reads; on paper it disappears. The notes are the second
   sheet, so nothing here can disturb the connector geometry on the first. */
.sheet .ap-insight { border-left-width: 5px; }
.sheet .ap-insight-critical { background: color-mix(in srgb, var(--status-critical) 9%, #fff); }
.sheet .ap-insight-good     { background: color-mix(in srgb, var(--status-good) 9%, #fff); }
.sheet .ap-insight-warning  { background: color-mix(in srgb, var(--status-warning) 12%, #fff); }
.sheet .ap-insight-text { font-size: 10.5px; line-height: 1.5; }
.sheet .ap-insight-title { font-size: 12px; }
.sheet .ap-caution { font-size: 9px; margin-top: var(--s-3); }

/* --- print: hide the toolbar and break the page. Nothing that has a size. --- */
@media print {
  .sheet-bar, .no-print { display: none !important; }
  .sheet-wrap { overflow: visible; }
  /* Sheet two: the notes the boxes cannot carry. */
  .ap-insights { break-before: page; }
  .ap-insight, .ap-caution, .sheet-foot { break-inside: avoid; }
}
</style>
</head>
<body data-page="print">
<div class="sheet-wrap">
<div class="sheet">

  <div class="sheet-bar">
    <p><strong>Print sheet.</strong> Paper <strong>11&nbsp;×&nbsp;17 (tabloid), landscape</strong>,
       scale <strong>100%</strong> — the page size is set in this file, so do not scale to fit.
       Turn <strong>background graphics on</strong>. Switch route below before printing:
       the sheet prints whichever one is on screen.</p>
    <span class="sheet-actions">
      <a class="btn btn-small" id="sheet-pdf" download>Download PDF</a>
      <button class="btn btn-primary" id="do-print">Print</button>
    </span>
  </div>

  <section id="approvals-slot"></section>

  <div class="sheet-foot">
    <span>Alberta Data Centre Hub — approvals path</span>
    <span id="printed-on"></span>
  </div>

</div>
</div>

<div class="sq-scrim" id="ap-scrim" hidden></div>
<aside class="sq-drawer" id="ap-drawer" role="dialog" aria-modal="true"
       aria-labelledby="ap-drawer-title" hidden></aside>

<script src="assets/app.js"></script>
<script src="assets/approvals.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  document.documentElement.setAttribute('data-theme', 'light');
});
document.getElementById('do-print').addEventListener('click', () => window.print());
document.getElementById('printed-on').textContent =
  'Printed ' + new Date().toISOString().slice(0, 10);
// The pre-rendered file for whichever route this sheet is showing.
{
  const route = new URLSearchParams(location.search).get('route') === 'offgrid'
    ? 'off-grid' : 'grid-connected';
  document.getElementById('sheet-pdf').href =
    `downloads/alberta-data-centre-approvals-${route}.pdf`;
}
</script>
</body>
</html>
