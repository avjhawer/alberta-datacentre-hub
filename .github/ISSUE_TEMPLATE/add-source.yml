name: Add a source
description: Add a news feed or an authority page to monitor. No code required.
title: "[source] "
labels: ["add-source"]
body:
  - type: markdown
    attributes:
      value: |
        Fill this in and submit. A workflow validates the entry and adds it to
        `site/data/sources.json` for you — you do not need to touch any code.

  - type: input
    id: name
    attributes:
      label: Source name
      description: How it should appear on the site.
      placeholder: Leduc County — Planning and Development
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: URL
      description: Must start with http:// or https://
      placeholder: https://www.leduc-county.com/planning
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What kind of source is this?
      options:
        - Authority page to watch for changes
        - RSS feed to pull items from
    validations:
      required: true

  - type: dropdown
    id: tier
    attributes:
      label: Source tier
      description: >
        Primary means a regulator, municipality or government publication.
        Reported means media or law-firm coverage. This drives the badge shown
        on every item, so please get it right.
      options:
        - primary
        - reported
    validations:
      required: true

  - type: dropdown
    id: region
    attributes:
      label: Region
      options:
        - alberta
        - canada
        - global
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why is this worth tracking?
      placeholder: Leduc County is drafting data centre provisions into its Land Use Bylaw.
