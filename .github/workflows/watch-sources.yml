name: Watch sources

# Two jobs feeds cannot do:
#   1. catch a bylaw or regulator page that changed with no announcement
#   2. find pages and feeds that did not exist when the source list was written
# Runs daily and opens an issue when something moves, so you get an email
# without having to watch the site.

on:
  schedule:
    - cron: '15 13 * * *'   # 07:15 MDT / 06:15 MST
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: watch-sources
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check watched pages for changes
        id: watch
        run: node scripts/watch-sources.mjs

      - name: Discover new sources
        id: discover
        run: node scripts/discover-sources.mjs

      - name: Validate data
        run: node scripts/validate-data.mjs

      - name: Open an issue for regulatory changes
        if: steps.watch.outputs.changed == 'true'
        uses: actions/github-script@v7
        env:
          SUMMARY: ${{ steps.watch.outputs.summary }}
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Regulatory change detected — ${new Date().toISOString().slice(0, 10)}`,
              labels: ['regulatory-change'],
              body: [
                'One or more watched authority pages changed since the last check.',
                '',
                process.env.SUMMARY,
                '',
                'These are hash-level detections: the page text moved, which is worth a look,',
                'but the change may be editorial rather than substantive. Open the source to confirm',
                'before updating any curated record.',
                '',
                '---',
                '_Generated by [Claude Code](https://claude.ai/code)_',
              ].join('\n'),
            });

      - name: Open an issue for candidate sources
        if: steps.discover.outputs.candidates == 'true'
        uses: actions/github-script@v7
        env:
          BODY: ${{ steps.discover.outputs.candidate_body }}
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `New candidate sources for review — ${new Date().toISOString().slice(0, 10)}`,
              labels: ['candidate-source'],
              body: [
                'These domains appeared repeatedly in the news feed but are not tracked, and are',
                'not government or regulator domains, so they were **not** added automatically.',
                '',
                process.env.BODY,
                '',
                'To add one, edit `site/data/sources.json` or use the **Add a source** issue form.',
                'To ignore it, just close this issue.',
                '',
                '---',
                '_Generated by [Claude Code](https://claude.ai/code)_',
              ].join('\n'),
            });

      - name: Commit state
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/watch-state.json site/data/alerts.json \
                  site/data/candidate-sources.json site/data/sources.json
          if git diff --cached --quiet; then
            echo "No source-watch changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(data): source watch and discovery"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # A regulator-page change is exactly the kind of thing that must reach the
  # published site the same day; the default token's push will not do it.
  publish:
    needs: watch
    if: needs.watch.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
