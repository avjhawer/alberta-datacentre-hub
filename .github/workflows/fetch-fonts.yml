name: Fetch fonts

# Downloads and self-hosts the interface typefaces. Manual: fonts change rarely.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node scripts/fetch-fonts.mjs
      - name: Commit fonts
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add site/assets/fonts site/assets/fonts.css
          if git diff --staged --quiet; then echo "no change"; else
            git commit -m "chore(fonts): self-host Inter and Space Grotesk (OFL)"
            git push
          fi
