name: Deploy site

# Publishes site/ to GitHub Pages. `enablement: true` on configure-pages turns
# Pages on automatically the first time this runs, so no manual setup step.
#
# `workflow_call` exists because a push made by a workflow using the default
# GITHUB_TOKEN does NOT trigger another workflow — GitHub blocks that to stop
# runaway loops. So the 3-hourly news commit could never fire this by `push`,
# and the published site sat at whichever commit a human last pushed while the
# repository's own data went on updating. The ingestion workflows now call this
# one as a job instead, which is a direct invocation and is not blocked.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate data before publishing
        run: node scripts/validate-data.mjs

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        run: |
          echo "### Site deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
