name: Apply issue form

# Turns a submitted "Add a source" form into a validated commit, so a source
# can be added without touching code. Anything that fails validation is
# reported back on the issue and nothing is committed.

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: apply-issue-form-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: contains(github.event.issue.labels.*.name, 'add-source')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Parse the form and update sources.json
        id: apply
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = context.payload.issue.body || '';

            // GitHub renders issue forms as "### Label\n\nvalue"
            const fields = {};
            for (const m of body.matchAll(/^###\s+(.+?)\s*\n+([\s\S]*?)(?=\n###\s|\s*$)/gm)) {
              fields[m[1].trim().toLowerCase()] = m[2].trim();
            }
            const get = k => {
              const v = fields[k];
              return (!v || v === '_No response_') ? '' : v;
            };

            const name   = get('source name');
            const url    = get('url');
            const kind   = get('what kind of source is this?');
            const tier   = get('source tier');
            const region = get('region');

            const problems = [];
            if (!name) problems.push('Source name is required.');
            if (!/^https?:\/\//i.test(url)) problems.push(`URL must start with http:// or https:// — got "${url}".`);
            if (!['primary', 'reported'].includes(tier)) problems.push(`Source tier must be primary or reported — got "${tier}".`);
            if (!['alberta', 'canada', 'global'].includes(region)) problems.push(`Region must be alberta, canada or global — got "${region}".`);

            const path = 'site/data/sources.json';
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            // Match on "RSS", not "feed" — the watch option's own text can
            // legitimately contain the word "feed".
            const isFeed = /\brss\b/i.test(kind);
            const bucket = isFeed ? data.feeds : data.watch;

            const id = (name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'source').slice(0, 40);
            if ([...data.feeds, ...data.watch].some(s => s.id === id)) problems.push(`A source with id "${id}" already exists.`);
            if ([...data.feeds, ...data.watch].some(s => s.url === url)) problems.push('That URL is already tracked.');

            if (problems.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: [
                  'I could not add this source yet:', '',
                  ...problems.map(p => `- ${p}`), '',
                  'Edit the issue to fix these and I will try again automatically.',
                  '', '---', '_Generated by [Claude Code](https://claude.ai/code)_',
                ].join('\n'),
              });
              core.setOutput('applied', 'false');
              return;
            }

            const entry = { id, name, tier, url, addedFromIssue: context.payload.issue.number };
            if (isFeed) entry.region = region;
            bucket.push(entry);
            fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
            core.setOutput('applied', 'true');
            core.setOutput('kind', isFeed ? 'feed' : 'watch page');
            core.setOutput('name', name);

      - name: Validate before committing
        if: steps.apply.outputs.applied == 'true'
        run: node scripts/validate-data.mjs

      - name: Commit
        if: steps.apply.outputs.applied == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/sources.json
          git commit -m "feat(sources): add ${{ steps.apply.outputs.name }} (#${{ github.event.issue.number }})"
          git push

      - name: Close the issue
        if: steps.apply.outputs.applied == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: [
                `Added **${{ toJSON(steps.apply.outputs.name) }}** as a ${{ steps.apply.outputs.kind }}.`,
                '',
                'It will be picked up on the next scheduled run.',
                '', '---', '_Generated by [Claude Code](https://claude.ai/code)_',
              ].join('\n'),
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.issue.number, state: 'closed',
            });
