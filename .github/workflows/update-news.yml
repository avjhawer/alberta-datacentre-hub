name: Refresh news feed

# The thing that keeps the site live. Every 3 hours it re-ingests every feed,
# reclassifies, rescores, and commits news.json if anything changed — then
# calls deploy.yml so the change actually reaches readers.
#
# The publish job is not optional decoration. A commit pushed with the default
# GITHUB_TOKEN does not trigger `on: push` workflows, so committing here is
# only half the loop; without the explicit call the repository stays current
# and the published site does not.

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch and classify feeds
        run: node scripts/fetch-news.mjs

      - name: Validate output
        run: node scripts/validate-data.mjs

      - name: Report
        run: |
          node -e '
            const d = require("./site/data/news.json");
            const ok = d.sourceHealth.filter(s => s.ok).length;
            const bad = d.sourceHealth.filter(s => !s.ok);
            const L = [];
            L.push("### News refresh", "");
            L.push(`- **${d.itemCount}** items from **${ok}/${d.sourceHealth.length}** healthy feeds`);
            L.push(`- Breaking: ${d.items.filter(i => i.breaking).length}`);
            L.push(`- Streams: \`${JSON.stringify(d.streamCounts)}\``);
            L.push(`- Regions: \`${JSON.stringify(d.regionCounts)}\``);
            L.push(`- generatedAt: \`${d.generatedAt}\``);
            if (bad.length) {
              L.push("", "**Failing feeds** (swap these for working queries):");
              for (const b of bad) L.push(`- \`${b.id}\` — ${b.error}`);
            }
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, L.join("\n") + "\n");
          '

      - name: Commit if changed
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- site/data/news.json; then
            echo "No change to news.json — nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git add site/data/news.json
            git commit -m "chore(data): refresh news feed"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Publish the commit above. See the note at the top of the file for why this
  # cannot be left to deploy.yml's own push trigger.
  publish:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
